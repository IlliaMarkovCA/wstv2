<!DOCTYPE html>
<html>
<head>
<title>WILDBOTS Tool</title>

<style>
body {
    font-family: Arial;
    padding: 40px;
}

.container {
    display: flex;
    gap: 40px;
    align-items: flex-start;
}

.form-box {
    width: 320px;
}

.preview-box {
    flex: 1;
    margin-top: 6px;
}

input, select, button {
    padding: 10px;
    margin: 6px 0;
    width: 100%;
}

button {
    font-size: 18px;
    cursor: pointer;
}

textarea {
    width: 100%;
    resize: vertical;
}

.hidden {
    display: none;
}
.wide-select {
  width: 344px;   /* make it wider */
}

.button-size{
  width: 344px;
}
</style>
</head>

<body>

<h2>WILDBOTS Email & PDF Tool</h2>

<form method="post">
<div class="container">

<!-- LEFT COLUMN -->
<div class="form-box">
<form method="post">

    <select id="nameType" name="name_type" class="wide-select" onchange="toggleNameFields()">
        <option value="N">First Name</option>
        <option value="L">Last Name</option>
        <option value="C">Company Name</option>
    </select>

    <select id="title" name="title" class="wide-select">
        <option>Sponsorship Opportunity: Support the WILDBOTS!</option>
        <option>Seeking Sponsorship for the WILDBOTS!</option>
        <option>Invest in STEM Education: Support the WILDBOTS!</option>
        <option>Partner with Us: Sponsorship Request from the WILDBOTS!</option>
        <option>Funding Request: Support the WILDBOTS in FRC</option>
    </select>

    <select id="email" name="email" class="wide-select">
        <option value=1>Introductory Email</option>
        <option value=2>Follow Up #1</option>
        <option value=4>Follow Up #2</option>
    </select>

    <input id="company" name="company" placeholder="Company Name" required>
    <input id="users_name" name="users_name" placeholder="Your Name" required>

    <div id="nameFields">
        <input id="name" name="name" placeholder="Name">
        <input id="who" name="who" placeholder="Mr / Ms">
    </div>

    <input id="emailAddress" name="email_address" placeholder="Email Address">

    <br>

    <!-- JS only -->
    <button type="button" class="button-size" onclick="generateEmail()">
        Generate Email
    </button>



    <!-- Submits to Flask -->
    <button formaction="/pdf" formmethod="post" class="button-size">
        PDF
    </button>

    <!-- Clearing the info -->
    <button type="button" class="button-size" onclick="clearAll()">
        Clear All
    </button>
    
</form>
</div>

<!-- RIGHT COLUMN -->
<div class="preview-box">
    <textarea id="previewEmailAddress"
              name="preview_email_address"
              rows="2"
              placeholder="Email Address"></textarea><br><br>

    <textarea id="previewSubject"
              name="preview_subject"
              rows="2"
              placeholder="Subject"></textarea><br><br>

    <!-- THIS IS WHAT FLASK USES -->
    <textarea id="previewEmail"
              name="email"
              rows="15"
              placeholder="Email Body"></textarea>
</div>

</div>

<script>
function toggleNameFields() {
    const type = document.getElementById("nameType").value;
    const fields = document.getElementById("nameFields");
    const email = document.getElementById("email").value;
    
    if (type === "C")
        document.getElementById("nameFields").style.display = "none";
    else if(type === "L")
        document.getElementById("nameFields").style.display = "inline-block";
    else if(type === "N")
        document.getElementById("nameFields").style.display = "inline-block"

    if (email == 1)

    else if(email == 2)

    else if(email == 2)
}

function clearAll() {
    // clear inputs
    document.getElementById("company").value = "";
    document.getElementById("name").value = "";
    document.getElementById("who").value = "";
    document.getElementById("emailAddress").value = "";

    // reset selects
    document.getElementById("title").selectedIndex = 0;

    // clear preview
    document.getElementById("previewEmailAddress").value = "";
    document.getElementById("previewSubject").value = "";
    document.getElementById("previewEmail").value = "";
}

function generateEmail() {
    const company = document.getElementById("company").value;
    const name = document.getElementById("name").value;
    const who = document.getElementById("who").value;
    const type = document.getElementById("nameType").value;
    const title = document.getElementById("title").value;
    const emailAddr = document.getElementById("emailAddress").value;
    const users_name = document.getElementById("users_name").value;

    let header = "";
    if (type === "N") header = `Hello ${name},`;
    else if (type === "L") header = `Dear ${who}.${name},`;
    else if(type === "C") header = `Hello ${company},`;

    const body_introductory = `${header}

        I hope this message finds you well. I'm ${users_name}, a high school student and proud member of Westminster WILDBOTS #6725, and I'm reaching out with great enthusiasm. We're passionate about STEM, robotics, and business, and we believe your support can help us achieve and learn incredible things. The WILDBOTS are a group of students from Westminster S.S. in London, Ontario who thrive on the excitement of the First Robotics Competition (FRC), where we design, build, and compete with robots in a fast-paced, dynamic environment. Through the years we’ve inspired students to pursue their passions in STEM and business and gain valuable experience throughout the build and competition seasons.

        We're excited about the potential of a partnership with you. Your sponsorship could empower us to inspire and educate the innovators of tomorrow, making a real impact on our community. Our team would love to have the opportunity to connect and discuss more about our team and sponsorship opportunities. I have attached more information about our team, a letter from our teacher mentors, and information about sponsorship or other opportunities.

        Thank you for considering our request, and I look forward to the opportunity to connect and share more about our team with you.

        Best regards,

        ${users_name}

        Teacher Mentor Contact: J. Levy, email J.Levy@TVDSB.ca`;

    const body_follow1 = `${header},

        I hope you're enjoying a pleasant day. I wanted to follow up on our initial outreach request on [DATE INITIAL EMAIL WAS SENT] and express our continued interest in the possibility of partnering with ${company} for the WILDBOTS’ exciting journey in STEM and business education and robotics.
        
        Your support can help empower us to explore STEM and business and support a community of leaders and innovators. We understand your time is valuable, and we appreciate your consideration. If you have any questions or would like to discuss this with one of our teacher’s further, please feel free to reach out at your convenience. We'd be thrilled to explore this partnership together.
        
        Thank you once again for considering our request, and we look forward to the opportunity to connect and discuss how we can work together to make a difference in the world of STEM.
        
        Warm regards,
        
        ${users_name}
        
        Teacher Mentor Contact: J. Levy, email  J.Levy@TVDSB.ca`;
 
    const body_follow2 = `${header},

        I hope this message finds you well. We truly appreciate the time and consideration you've given to our previous emails, and we understand that you may have a busy schedule. This is our final follow-up regarding the potential sponsorship for the WILDBOTS this season.
        
        As passionate students dedicated to STEM education and robotics, we believe that a partnership with you could truly elevate our capabilities and continue our mission to inspire the next generation of innovators. Your involvement can shape the futures of countless young minds eager to embrace the world of science, technology, engineering, and mathematics. We would be honored to have you as our partner in this journey. If you have any questions or if you're ready to discuss the details, please do not hesitate to reach out. We genuinely hope this won't be our last conversation and that we can explore the possibilities of working together to make a difference.
        
        Thank you for considering our request, and we hope to hear from you soon. If not, we extend our heartfelt gratitude for your attention and support thus far.
        
        Warm regards,
        
        ${users_name}

        Teacher Mentor Contact: J. Levy, email  J.Levy@TVDSB.ca`;

    document.getElementById("previewEmailAddress").value = emailAddr;
    document.getElementById("previewSubject").value = title;
    document.getElementById("previewEmail").value = body;
}
</script>

</body>
</html>
